        qualityScore: { type: ["integer", "null"] }
        confidenceScore: { type: ["number", "null"] }
        aiSummary: { type: ["string", "null"] }
        status: { type: string, enum: [pending, accepted, declined] }
        declineReason: { type: ["string", "null"] }
