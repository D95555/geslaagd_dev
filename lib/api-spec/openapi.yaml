        releaseDate: { type: ["string", "null"] }
        qualityScore: { type: ["integer", "null"] }
        aiSummary: { type: ["string", "null"] }
        createdAt: { type: ["string", "null"] }

    # ─── Study Module ──────────────────────────────────────────────────────
    Chapter:
      type: object
      required: [id, subjectId, position, title, description, isImportant, topicTags, status]
      properties:
        id: { type: string, format: uuid }
        subjectId: { type: string, format: uuid }
        position: { type: integer }
        title: { type: string }
        description: { type: string }
        isImportant: { type: boolean }
        topicTags: { type: array, items: { type: string } }
        status: { type: string, enum: [pending, ready] }
    SubjectSummary:
      type: object
      required: [id, name, yearLevel, description, difficultyLevel, publishStatus, chapterCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        yearLevel: { type: string, enum: [vwo, bachelor1] }
        description: { type: ["string", "null"] }
        difficultyLevel: { type: ["string", "null"] }
        publishStatus: { type: string, enum: [incomplete, ready, published] }
        chapterCount: { type: ["integer", "null"] }
    SubjectDetail:
      allOf:
        - $ref: "#/components/schemas/SubjectSummary"
        - type: object
          required: [chapters]
          properties:
            chapters:
              type: array
              items: { $ref: "#/components/schemas/Chapter" }
    Citation:
      type: object
      required: [index, sourceId, title, url]
      properties:
        index: { type: integer }
        sourceId: { type: string }
        title: { type: string }
        url: { type: string }
    SummaryContent:
      type: object
      required: [title, body, citations, wordCount]
      properties:
        title: { type: string }
        body: { type: string }
        citations: { type: array, items: { $ref: "#/components/schemas/Citation" } }
        wordCount: { type: integer }
    KeyNotesContent:
      type: object
      required: [sections]
      properties:
        sections:
          type: array
          items:
            type: object
