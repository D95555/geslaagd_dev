openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sessions
    description: Signed-in session operations
  - name: admin
    description: Administrator-only operations
  - name: study
    description: Signed-in study environment operations
  - name: crawl
    description: Administrator-only source crawl pipeline operations
  - name: sources
    description: Signed-in student source and subject-request operations
  - name: subjects
    description: Student-facing subject, chapter and study-content browsing
  - name: study-chat
    description: StudyHandler AI chat operations
  - name: study-exercises
    description: Exercise and exam operations
  - name: study-progress
    description: Progress tracking, weakness detection, exam scheduling and study planning
  - name: admin-pipeline
    description: Pipeline task monitoring and content publishing
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /sessions:
    post:
      operationId: registerSession
      tags: [sessions]
      summary: Register the current browser session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionRegistration"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackedSession"
  /sessions/heartbeat:
    post:
      operationId: heartbeatSession
      tags: [sessions]
      summary: Refresh the current browser session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionHeartbeat"
      responses:
        "204":
          description: Updated
  /events/auth:
    post:
      operationId: logAuthEvent
      tags: [sessions]
      summary: Log a safe account security event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthEventInput"
      responses:
        "204":
          description: Logged
  /auth/password-reset-request:
    post:
      operationId: requestPasswordReset
      tags: [sessions]
      summary: Request a password-reset email without revealing account existence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequestInput"
      responses:
        "204":
          description: Request accepted
  /admin/sessions:
    get:
      operationId: listAdminSessions
      tags: [admin]
      summary: List tracked browser sessions
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminTrackedSession"
  /admin/sessions/{sessionId}/revoke:
    post:
      operationId: revokeAdminSession
      tags: [admin]
      summary: Revoke a selected browser session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Revoked session
          content:
            application/json:
              schema:
                  $ref: "#/components/schemas/AdminTrackedSession"
  /admin/broadcasts:
    post:
      operationId: sendAdminBroadcast
      tags: [admin]
      summary: Send a live message to signed-in browsers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BroadcastInput"
      responses:
        "204":
          description: Sent
  /admin/accounts:
    get:
      operationId: listAdminAccounts
      tags: [admin]
      summary: Search and list accounts
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, active, blocked]
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccountList"
  /admin/accounts/{userId}:
    get:
      operationId: getAdminAccount
      tags: [admin]
      summary: Get an account's full detail for admin review
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Account detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccountDetail"
    delete:
      operationId: deleteAdminAccount
      tags: [admin]
      summary: Permanently delete an account
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAccountActionInput"
      responses:
        "204":
          description: Deleted
  /admin/accounts/{userId}/block:
    post:
      operationId: blockAdminAccount
      tags: [admin]
      summary: Temporarily block an account and revoke its active sessions
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAccountActionInput"
      responses:
        "200":
          description: Updated account summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccountSummary"
  /admin/accounts/{userId}/unblock:
    post:
      operationId: unblockAdminAccount
      tags: [admin]
      summary: Lift a temporary block on an account
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminAccountActionInput"
      responses:
        "200":
          description: Updated account summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccountSummary"
  /study/catalog:
    get:
      operationId: getStudyCatalog
      tags: [study]
      summary: Get the study catalog
      parameters:
        - name: query
          in: query
          required: false
          schema:
            type: string
        - name: subjectId
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Study catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyCatalog"
  /study/spaces:
    get:
      operationId: listStudySpaces
      tags: [study]
      summary: List the current user's study spaces
      responses:
        "200":
          description: Study spaces
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudySpace"
    post:
      operationId: createStudySpace
      tags: [study]
      summary: Create a study space from the catalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudySpaceInput"
      responses:
        "201":
          description: Created study space
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudySpace"
  /study/spaces/{spaceId}:
    get:
      operationId: getStudySpace
      tags: [study]
      summary: Get one of the current user's study spaces
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Study space
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudySpace"
    patch:
      operationId: updateStudySpace
      tags: [study]
      summary: Update an existing study space's topic configuration
      parameters:
        - name: spaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudySpaceUpdate"
      responses:
        "200":
          description: Updated study space
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudySpace"
  /study/subjects/{selectionId}:
    get:
      operationId: getStudySubjectDetail
      tags: [study]
      summary: Get a chosen subject's detail - results placeholder, recent and all topics
      parameters:
        - name: selectionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Subject detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudySubjectDetail"
  /study/proposals:
    post:
      operationId: createStudyProposal
      tags: [study]
      summary: Interpret a free-text study topic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudyProposalInput"
      responses:
        "201":
          description: AI proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyProposal"
  /study/proposals/{proposalId}/confirm:
    post:
      operationId: confirmStudyProposal
      tags: [study]
      summary: Confirm an AI proposal and create a study space
      parameters:
        - name: proposalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudyProposalConfirmation"
      responses:
        "201":
          description: Created study space
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudySpace"
  /study/proposals/{proposalId}/reject:
    post:
      operationId: rejectStudyProposal
      tags: [study]
      summary: Reject an AI proposal
      parameters:
        - name: proposalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Rejected
  /study/selected-subjects:
    get:
      operationId: listSelectedStudySubjects
      tags: [study]
      summary: List the current user's chosen subjects, in order
      responses:
        "200":
          description: Chosen subjects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SelectedStudySubject"
    post:
      operationId: createSelectedStudySubject
      tags: [study]
      summary: Add a subject to the current user's chosen subjects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectedStudySubjectInput"
      responses:
        "201":
          description: Chosen subject
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SelectedStudySubject"
  /study/selected-subjects/order:
    put:
      operationId: reorderSelectedStudySubjects
      tags: [study]
      summary: Persist the display order of the current user's chosen subjects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderSelectedStudySubjectsInput"
      responses:
        "200":
          description: Reordered subjects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SelectedStudySubject"
  /study/selected-subjects/{selectionId}:
    delete:
      operationId: deleteSelectedStudySubject
      tags: [study]
      summary: Remove a subject from the current user's chosen subjects
      parameters:
        - name: selectionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Removed
  /study/preferences:
    get:
      operationId: getStudyPreferences
      tags: [study]
      summary: Get the current user's study onboarding preferences
      responses:
        "200":
          description: Study preferences or null before onboarding
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/StudyPreferences"
                  - type: "null"
    put:
      operationId: upsertStudyPreferences
      tags: [study]
      summary: Save the current user's study onboarding preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudyPreferencesInput"
      responses:
        "200":
          description: Saved preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyPreferences"
  /admin/crawl/subjects:
    post:
      operationId: createCrawlSubject
      tags: [crawl]
      summary: Create and activate a crawl subject directly
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CrawlSubjectCreateInput"
      responses:
        "201":
          description: Created subject
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrawlSubject"
    get:
      operationId: listCrawlSubjects
      tags: [crawl]
      summary: List all crawl subjects
      responses:
        "200":
          description: Subjects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CrawlSubject"
  /admin/crawl/subject-requests:
    get:
      operationId: listCrawlSubjectRequests
      tags: [crawl]
      summary: List pending student subject requests
      responses:
        "200":
          description: Pending subject requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CrawlSubjectRequest"
  /admin/crawl/subject-requests/{requestId}/approve:
    post:
      operationId: approveCrawlSubjectRequest
      tags: [crawl]
      summary: Approve a student subject request
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Approved
  /admin/crawl/subject-requests/{requestId}/deny:
    post:
      operationId: denyCrawlSubjectRequest
      tags: [crawl]
      summary: Deny a student subject request
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminNoteInput"
      responses:
        "200":
          description: Denied
  /admin/crawl/subject-requests/{requestId}/request-refinement:
    post:
      operationId: requestCrawlSubjectRefinement
      tags: [crawl]
      summary: Ask a student to refine their subject request
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminNoteInput"
      responses:
        "200":
          description: Refinement requested
  /admin/crawl/run:
    post:
      operationId: runCrawl
      tags: [crawl]
      summary: Trigger a full sourceCrawler/sourceHandler pipeline run for a subject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunCrawlInput"
      responses:
        "200":
          description: Completed crawl summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrawlRunResult"
  /admin/crawl/crawls:
    get:
      operationId: listCrawls
      tags: [crawl]
      summary: List all crawls, most recent first
      responses:
        "200":
          description: Crawls
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CrawlSummary"
  /admin/crawl/crawls/{crawlId}:
    get:
      operationId: getCrawlDetail
      tags: [crawl]
      summary: Get a crawl's metadata and discovered sources
      parameters:
        - name: crawlId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Crawl detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrawlDetail"
  /admin/crawl/pending:
    get:
      operationId: listPendingSources
      tags: [crawl]
      summary: List all sources awaiting human review
      responses:
        "200":
          description: Pending sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PendingSource"
  /admin/crawl/sources/{sourceId}/accept:
    post:
      operationId: acceptPendingSource
      tags: [crawl]
      summary: Manually accept a pending source
      parameters:
        - name: sourceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Accepted source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrawlSource"
  /admin/crawl/sources/{sourceId}/decline:
    post:
      operationId: declinePendingSource
      tags: [crawl]
      summary: Manually decline a pending source
      parameters:
        - name: sourceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeclineSourceInput"
      responses:
        "200":
          description: Declined source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrawlSource"
  /admin/crawl/sources/{sourceId}/rescore:
    post:
      operationId: rescoreSource
      tags: [crawl]
      summary: Re-run AI scoring for a single source
      parameters:
        - name: sourceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Rescored source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CrawlSource"
  /sources/request-subject:
    post:
      operationId: requestSourceSubject
      tags: [sources]
      summary: Ask for a new study subject to be crawled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestSubjectInput"
      responses:
        "201":
          description: Subject request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestSubjectResult"
  /sources/subject-requests:
    get:
      operationId: listMySourceSubjectRequests
      tags: [sources]
      summary: List the current student's subject requests
      responses:
        "200":
          description: Subject requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CrawlSubjectRequest"
  /sources/{sourceId}/reconsider:
    post:
      operationId: reconsiderSource
      tags: [sources]
      summary: Request reconsideration of a declined source
      parameters:
        - name: sourceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReconsiderSourceInput"
      responses:
        "201":
          description: Reconsideration request submitted
  /sources:
    get:
      operationId: listSources
      tags: [sources]
      summary: List accepted sources, optionally filtered by subject
      parameters:
        - name: subject
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Accepted sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentSource"

  # ─── subjects ────────────────────────────────────────────────────────────
  /subjects:
    get:
      operationId: listSubjects
      tags: [subjects]
      summary: List published subjects
      responses:
        "200":
          description: Published subjects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubjectSummary"
  /subjects/{subjectId}:
    get:
      operationId: getSubjectDetail
      tags: [subjects]
      summary: Subject detail with chapter list
      parameters:
        - name: subjectId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Subject detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectDetail"
        "404":
          description: Subject not found or not published
  /subjects/{subjectId}/select:
    post:
      operationId: selectSubject
      tags: [subjects]
      summary: Add a subject to the student's study list
      parameters:
        - name: subjectId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201":
          description: Subject added
  /subjects/{subjectId}/progress:
    get:
      operationId: getSubjectProgress
      tags: [subjects]
      summary: Progress bar, per-chapter breakdown and weak topics
      parameters:
        - name: subjectId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProgress"
  /subjects/{subjectId}/chapters/{chapterId}/content:
    get:
      operationId: getChapterContent
      tags: [subjects]
      summary: Chapter summary and key notes
      parameters:
        - name: subjectId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: chapterId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Chapter content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChapterContent"
        "404":
          description: Chapter not found
  /subjects/{subjectId}/chapters/{chapterId}/mark-read:
    post:
      operationId: markChapterRead
      tags: [subjects]
      summary: Mark the chapter summary as read
      parameters:
        - name: subjectId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: chapterId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Marked as read

  # ─── study-exercises ────────────────────────────────────────────────────
  /subjects/{subjectId}/chapters/{chapterId}/exercises:
    get:
      operationId: getChapterExercises
      tags: [study-exercises]
      summary: Shuffled exercise selection for this chapter
      parameters:
        - name: subjectId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: chapterId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Exercise set (no answers included)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExerciseSetPublic"
  /subjects/{subjectId}/chapters/{chapterId}/exercises/submit:
    post:
      operationId: submitChapterExercises
      tags: [study-exercises]
      summary: Submit exercise answers and receive a grade
      parameters:
        - name: subjectId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: chapterId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExerciseSubmission"
      responses:
        "200":
          description: Grade result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GradeResult"
  /subjects/{subjectId}/chapters/{chapterId}/exam:
    get:
      operationId: getChapterExam
      tags: [study-exercises]
      summary: Exam questions for this chapter (no answers included)
      parameters:
        - name: subjectId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: chapterId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Exam set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExerciseSetPublic"
        "404":
          description: This chapter has no exam
  /subjects/{subjectId}/chapters/{chapterId}/exam/submit:
    post:
      operationId: submitChapterExam
      tags: [study-exercises]
      summary: Submit exam answers and receive a grade
      parameters:
        - name: subjectId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: chapterId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExerciseSubmission"
      responses:
        "200":
          description: Grade result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GradeResult"

  # ─── study-progress ─────────────────────────────────────────────────────
  /subjects/{subjectId}/weaknesses:
    get:
      operationId: getSubjectWeaknesses
      tags: [study-progress]
      summary: Weak topics and practice suggestions
      parameters:
        - name: subjectId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Weak topics
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WeakTopic"
  /subjects/{subjectId}/exams/schedule:
    post:
      operationId: scheduleSubjectExam
      tags: [study-progress]
      summary: Set a real exam date and covered chapters
      parameters:
        - name: subjectId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleExamInput"
      responses:
        "201":
          description: Exam scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentExam"
  /subjects/{subjectId}/study-plan:
    get:
      operationId: getSubjectStudyPlan
      tags: [study-progress]
      summary: Today's spaced repetition review plan
      parameters:
        - name: subjectId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Study plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyPlanResponse"
  /subjects/{subjectId}/questionnaire:
    get:
      operationId: getSubjectQuestionnaire
      tags: [study-progress]
      summary: Diagnostic self-assessment questionnaire
      parameters:
        - name: subjectId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Questionnaire
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticQuestionnaire"
        "404":
          description: No questionnaire available yet
  /subjects/{subjectId}/questionnaire/submit:
    post:
      operationId: submitSubjectQuestionnaire
      tags: [study-progress]
      summary: Submit self-assessment answers
      parameters:
        - name: subjectId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionnaireSubmissionInput"
      responses:
        "200":
          description: Stored

  # ─── study-chat ─────────────────────────────────────────────────────────
  /subjects/{subjectId}/chat:
    get:
      operationId: listChatMessages
      tags: [study-chat]
      summary: Chat history with StudyHandler (paginated)
      parameters:
        - name: subjectId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: before
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: Chat messages, newest last
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
    post:
      operationId: sendChatMessage
      tags: [study-chat]
      summary: Send a message to StudyHandler
      parameters:
        - name: subjectId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendChatMessageInput"
      responses:
        "200":
          description: StudyHandler's reply
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"

  # ─── admin-pipeline ─────────────────────────────────────────────────────
  /admin/pipeline/tasks:
    get:
      operationId: listPipelineTasks
      tags: [admin-pipeline]
      summary: List pipeline tasks, optionally filtered
      parameters:
        - name: subjectId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [waiting, ready, running, done, failed] }
      responses:
        "200":
          description: Pipeline tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PipelineTask"
  /admin/pipeline/tasks/{taskId}:
    get:
      operationId: getPipelineTaskDetail
      tags: [admin-pipeline]
      summary: One task with its full log and closing summary
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Task detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineTaskDetail"
        "404":
          description: Task not found
  /admin/pipeline/logs:
    get:
      operationId: listPipelineLogs
      tags: [admin-pipeline]
      summary: Newest log entries across all tasks, for the console
      parameters:
        - name: subjectId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: level
          in: query
          required: false
          schema: { type: string, enum: [info, warn, error] }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: Log entries, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PipelineLogEntry"
  /admin/pipeline/tasks/{taskId}/retry:
    post:
      operationId: retryPipelineTask
      tags: [admin-pipeline]
      summary: Retry a failed pipeline task, optionally overriding its config
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                config: { type: object, additionalProperties: true }
      responses:
        "200":
          description: Task requeued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineTask"
  /admin/pipeline/tasks/{taskId}/cancel:
    post:
      operationId: cancelPipelineTask
      tags: [admin-pipeline]
      summary: Cancel a stuck pipeline task
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Task cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineTask"
  /admin/subjects/{subjectId}/content:
    get:
      operationId: getAdminSubjectContent
      tags: [admin-pipeline]
      summary: Preview generated content for a subject before publishing
      parameters:
        - name: subjectId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Subject content preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSubjectContentPreview"
  /admin/subjects/{subjectId}/publish:
    post:
      operationId: publishSubject
      tags: [admin-pipeline]
      summary: Publish a subject whose readiness check passed
      parameters:
        - name: subjectId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubjectSummary"
        "409":
          description: Subject is not ready to publish

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SessionRegistration:
      type: object
      required: [clientSessionId, deviceLabel]
      properties:
        clientSessionId:
          type: string
        deviceLabel:
          type: string
          minLength: 1
          maxLength: 160
    SessionHeartbeat:
      type: object
      required: [clientSessionId]
      properties:
        clientSessionId:
          type: string
        currentPage:
          type: string
          maxLength: 200
    AuthEventInput:
      type: object
      required: [event]
      properties:
        event:
          type: string
          enum: [signup, login, logout, password-reset-request, password-changed]
        email:
          type: string
          format: email
        userId:
          type: string
          format: uuid
        device:
          type: string
          maxLength: 160
    PasswordResetRequestInput:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        device:
          type: string
          maxLength: 160
    TrackedSession:
      type: object
      required: [clientSessionId, userId, email, deviceLabel, createdAt, lastSeenAt, revokedAt]
      properties:
        clientSessionId:
          type: string
        userId:
          type: string
        email:
          type: string
        deviceLabel:
          type: string
        createdAt:
          type: string
        lastSeenAt:
          type: string
        revokedAt:
          type: ["string", "null"]
    AdminTrackedSession:
      type: object
      required: [clientSessionId, userId, email, deviceLabel, createdAt, lastSeenAt, revokedAt, ipAddress, currentPage]
      properties:
        clientSessionId:
          type: string
        userId:
          type: string
        email:
          type: string
        deviceLabel:
          type: string
        createdAt:
          type: string
        lastSeenAt:
          type: string
        revokedAt:
          type: ["string", "null"]
        ipAddress:
          type: ["string", "null"]
          description: Latest server-observed IP address for this browser session.
        currentPage:
          type: ["string", "null"]
          description: Latest client-reported route (path only), refreshed on the heartbeat cadence.
    BroadcastInput:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 70
        body:
          type: string
          minLength: 1
          maxLength: 320
    StudySubject:
      type: object
      required: [id, name, slug, description, aliases, sortOrder]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        aliases:
          type: array
          items: { type: string }
        sortOrder: { type: integer }
    StudyBook:
      type: object
      required: [id, subjectId, title, publisher, edition, description, sortOrder]
      properties:
        id: { type: string }
        subjectId: { type: string }
        title: { type: string }
        publisher: { type: string }
        edition: { type: string }
        description: { type: string }
        sortOrder: { type: integer }
    StudyChapter:
      type: object
      required: [id, bookId, chapterNumber, title, description, topics, sortOrder]
      properties:
        id: { type: string }
        bookId: { type: string }
        chapterNumber: { type: integer }
        title: { type: string }
        description: { type: string }
        topics:
          type: array
          items: { type: string }
        sortOrder: { type: integer }
    StudyCatalog:
      type: object
      required: [subjects, books, chapters]
      properties:
        subjects:
          type: array
          items: { $ref: "#/components/schemas/StudySubject" }
        books:
          type: array
          items: { $ref: "#/components/schemas/StudyBook" }
        chapters:
          type: array
          items: { $ref: "#/components/schemas/StudyChapter" }
    StudySpace:
      type: object
      required: [id, title, sourceType, subjectId, bookId, chapterId, originalInput, createdAt, updatedAt, selectedSubjectId, level, subtopics, sources, subjectDescription, exampleTopics, status, lastViewedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        sourceType: { type: string, enum: [catalog, ai] }
        subjectId: { type: ["string", "null"] }
        bookId: { type: ["string", "null"] }
        chapterId: { type: ["string", "null"] }
        originalInput: { type: ["string", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
        selectedSubjectId: { type: ["string", "null"], format: uuid }
        level: { type: ["string", "null"], enum: [basis, gemiddeld, verdieping, null] }
        subtopics:
          type: array
          items: { type: string }
        sources:
          type: array
          items: { type: string }
        subjectDescription: { type: string }
        exampleTopics:
          type: array
          items: { type: string }
        status: { type: string, enum: [draft, active] }
        lastViewedAt: { type: string }
    StudySpaceInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        subjectId: { type: ["string", "null"] }
        bookId: { type: ["string", "null"] }
        chapterId: { type: ["string", "null"] }
        selectedSubjectId: { type: ["string", "null"], format: uuid }
        level: { type: ["string", "null"], enum: [basis, gemiddeld, verdieping, null] }
        subtopics:
          type: array
          maxItems: 8
          items: { type: string, minLength: 1, maxLength: 80 }
        sources:
          type: array
          maxItems: 6
          items: { type: string, minLength: 1, maxLength: 120 }
        subjectDescription: { type: string, maxLength: 500 }
        exampleTopics:
          type: array
          maxItems: 6
          items: { type: string, minLength: 1, maxLength: 120 }
        status: { type: string, enum: [draft, active] }
    StudySpaceUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        selectedSubjectId: { type: ["string", "null"], format: uuid }
        level: { type: ["string", "null"], enum: [basis, gemiddeld, verdieping, null] }
        subtopics:
          type: array
          maxItems: 8
          items: { type: string, minLength: 1, maxLength: 80 }
        sources:
          type: array
          maxItems: 6
          items: { type: string, minLength: 1, maxLength: 120 }
        subjectDescription: { type: string, maxLength: 500 }
        exampleTopics:
          type: array
          maxItems: 6
          items: { type: string, minLength: 1, maxLength: 120 }
        status: { type: string, enum: [draft, active] }
    StudyProposalInput:
      type: object
      required: [input]
      properties:
        input: { type: string, minLength: 3, maxLength: 500 }
    StudyProposal:
      type: object
      required: [id, originalInput, subjectId, proposedSubject, proposedTopic, rationale, searchTerms, alternatives, clarificationQuestion, confidence, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        originalInput: { type: string }
        subjectId: { type: ["string", "null"] }
        proposedSubject: { type: string }
        proposedTopic: { type: string }
        rationale: { type: string }
        searchTerms:
          type: array
          items: { type: string }
        alternatives:
          type: array
          maxItems: 3
          items:
            $ref: "#/components/schemas/StudyProposalAlternative"
        clarificationQuestion: { type: ["string", "null"] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        status: { type: string, enum: [pending, confirmed, rejected] }
        createdAt: { type: string }
    StudyProposalConfirmation:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 160 }
        subjectId: { type: ["string", "null"] }
        proposedSubject: { type: string, minLength: 1, maxLength: 160 }
        proposedTopic: { type: string, minLength: 1, maxLength: 160 }
        selectedSubjectId: { type: ["string", "null"], format: uuid }
        level: { type: ["string", "null"], enum: [basis, gemiddeld, verdieping, null] }
        subtopics:
          type: array
          maxItems: 8
          items: { type: string, minLength: 1, maxLength: 80 }
        sources:
          type: array
          maxItems: 6
          items: { type: string, minLength: 1, maxLength: 120 }
        subjectDescription: { type: string, maxLength: 500 }
        exampleTopics:
          type: array
          maxItems: 6
          items: { type: string, minLength: 1, maxLength: 120 }
        status: { type: string, enum: [draft, active] }
    StudyProposalAlternative:
      type: object
      required: [subjectId, proposedSubject, proposedTopic, rationale]
      properties:
        subjectId: { type: ["string", "null"] }
        proposedSubject: { type: string }
        proposedTopic: { type: string }
        rationale: { type: string }
    SelectedStudySubject:
      type: object
      required: [id, subjectId, customName, name, sortOrder, createdAt]
      properties:
        id: { type: string, format: uuid }
        subjectId: { type: ["string", "null"] }
        customName: { type: ["string", "null"] }
        name: { type: string }
        sortOrder: { type: integer }
        createdAt: { type: string }
    SelectedStudySubjectInput:
      type: object
      properties:
        subjectId: { type: string }
        customName: { type: string, minLength: 1, maxLength: 80 }
    ReorderSelectedStudySubjectsInput:
      type: object
      required: [orderedIds]
      properties:
        orderedIds:
          type: array
          minItems: 1
          maxItems: 5
          items: { type: string, format: uuid }
    StudyPreferencesInput:
      type: object
      required: [educationLevel, studyProfile, learningGoals]
      properties:
        educationLevel: { type: string, enum: [vwo6, bachelor1] }
        studyProfile: { type: string, maxLength: 100 }
        learningGoals:
          type: array
          minItems: 1
          maxItems: 5
          items: { type: string, minLength: 1, maxLength: 80 }
    StudyPreferences:
      allOf:
        - $ref: "#/components/schemas/StudyPreferencesInput"
        - type: object
          required: [updatedAt]
          properties:
            updatedAt: { type: string }
    StudySubjectResultItem:
      type: object
      required: [label, value]
      properties:
        label: { type: string }
        value: { type: string }
    StudySubjectResults:
      type: object
      required: [isPlaceholder, note, items]
      properties:
        isPlaceholder: { type: boolean }
        note: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/StudySubjectResultItem" }
    StudySubjectDetail:
      type: object
      required: [selection, subject, recentTopics, topics, results]
      properties:
        selection: { $ref: "#/components/schemas/SelectedStudySubject" }
        subject:
          anyOf:
            - $ref: "#/components/schemas/StudySubject"
            - type: "null"
        results: { $ref: "#/components/schemas/StudySubjectResults" }
        recentTopics:
          type: array
          items: { $ref: "#/components/schemas/StudySpace" }
        topics:
          type: array
          items: { $ref: "#/components/schemas/StudySpace" }
    AdminAccountSummary:
      type: object
      required: [userId, email, status, createdAt, lastSignInAt, bannedUntil, sessionCount, lastSeenAt]
      properties:
        userId: { type: string, format: uuid }
        email: { type: string }
        status: { type: string, enum: [active, blocked] }
        createdAt: { type: string }
        lastSignInAt: { type: ["string", "null"] }
        bannedUntil: { type: ["string", "null"] }
        sessionCount: { type: integer }
        lastSeenAt: { type: ["string", "null"] }
    AdminAccountList:
      type: object
      required: [accounts, total, page, limit]
      properties:
        accounts:
          type: array
          items: { $ref: "#/components/schemas/AdminAccountSummary" }
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
    AdminAccountPreferences:
      type: object
      required: [educationLevel, studyProfile, learningGoals, updatedAt]
      properties:
        educationLevel: { type: string }
        studyProfile: { type: string }
        learningGoals:
          type: array
          items: { type: string }
        updatedAt: { type: string }
    AdminStudySpaceSummary:
      type: object
      required: [id, title, sourceType, status, level, createdAt, updatedAt, lastViewedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        sourceType: { type: string, enum: [catalog, ai] }
        status: { type: string, enum: [draft, active] }
        level: { type: ["string", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
        lastViewedAt: { type: ["string", "null"] }
    AdminAccountAction:
      type: object
      required: [id, actorId, action, reason, result, errorDetail, createdAt]
      properties:
        id: { type: string, format: uuid }
        actorId: { type: string, format: uuid }
        action: { type: string, enum: [block, unblock, delete] }
        reason: { type: string }
        result: { type: string, enum: [success, failed] }
        errorDetail: { type: ["string", "null"] }
        createdAt: { type: string }
    AdminAccountDetail:
      type: object
      required: [summary, selectedSubjects, preferences, studySpaces, recentSessions, recentActions]
      properties:
        summary: { $ref: "#/components/schemas/AdminAccountSummary" }
        selectedSubjects:
          type: array
          items: { $ref: "#/components/schemas/SelectedStudySubject" }
        preferences:
          anyOf:
            - $ref: "#/components/schemas/AdminAccountPreferences"
            - type: "null"
        studySpaces:
          type: array
          items: { $ref: "#/components/schemas/AdminStudySpaceSummary" }
        recentSessions:
          type: array
          items: { $ref: "#/components/schemas/AdminTrackedSession" }
        recentActions:
          type: array
          items: { $ref: "#/components/schemas/AdminAccountAction" }
    AdminAccountActionInput:
      type: object
      required: [reason, idempotencyKey]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }
        idempotencyKey: { type: string, minLength: 1, maxLength: 160 }
    CrawlSubject:
      type: object
      required: [id, name, yearLevel, status, publishStatus, requestedBy, approvedBy, adminNote, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        yearLevel: { type: string, enum: [vwo, bachelor1] }
        status: { type: string, enum: [pending, active, denied, needs_refinement] }
        publishStatus: { type: string, enum: [incomplete, ready, published] }
        requestedBy: { type: ["string", "null"] }
        approvedBy: { type: ["string", "null"] }
        adminNote: { type: ["string", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
    CrawlSubjectCreateInput:
      type: object
      required: [name, year_level]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        year_level: { type: string, enum: [vwo, bachelor1] }
    CrawlSubjectRequest:
      type: object
      required: [id, subjectId, subjectName, yearLevel, studentId, status, adminNote, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        subjectId: { type: ["string", "null"] }
        subjectName: { type: ["string", "null"] }
        yearLevel: { type: ["string", "null"], enum: [vwo, bachelor1, null] }
        studentId: { type: string }
        status: { type: string, enum: [pending, approved, denied, needs_refinement] }
        adminNote: { type: ["string", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
    AdminNoteInput:
      type: object
      required: [adminNote]
      properties:
        adminNote: { type: string, minLength: 1, maxLength: 1000 }
    RunCrawlInput:
      type: object
      required: [subjectId]
      properties:
        subjectId: { type: string, format: uuid }
    CrawlRunResult:
      type: object
      required: [crawlId, sourcesFound, sourcesAccepted, creditsUsed, efficiencyRatio]
      properties:
        crawlId: { type: string, format: uuid }
        sourcesFound: { type: integer }
        sourcesAccepted: { type: integer }
        creditsUsed: { type: ["integer", "null"] }
        efficiencyRatio: { type: ["number", "null"] }
    CrawlSummary:
      type: object
      required: [id, subjectId, subjectName, status, sourcesFound, sourcesAccepted, creditsUsed, efficiencyRatio, createdAt, completedAt]
      properties:
        id: { type: string, format: uuid }
        subjectId: { type: string }
        subjectName: { type: string }
        status: { type: string, enum: [running, complete, failed] }
        sourcesFound: { type: ["integer", "null"] }
        sourcesAccepted: { type: ["integer", "null"] }
        creditsUsed: { type: ["integer", "null"] }
        efficiencyRatio: { type: ["number", "null"] }
        createdAt: { type: string }
        completedAt: { type: ["string", "null"] }
    CrawlSource:
