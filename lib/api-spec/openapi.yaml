                  type: object
                  required: [label, value, topicTag]
                  properties:
                    label: { type: string }
                    value: { type: string }
                    topicTag: { type: string }
    ChapterContent:
      type: object
      required: [summary, keyNotes]
      properties:
        summary: { oneOf: [{ $ref: "#/components/schemas/SummaryContent" }, { type: "null" }] }
        keyNotes: { oneOf: [{ $ref: "#/components/schemas/KeyNotesContent" }, { type: "null" }] }
    ExerciseQuestionPublic:
      type: object
      required: [index, type, topicTag, pointValue, prompt]
